<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Casino Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: var(--tg-theme-bg-color, #0f0f1a);
      --text: var(--tg-theme-text-color, #fff);
      --hint: var(--tg-theme-hint-color, #8a8a9a);
      --gold: #f5c542;
      --gold-dark: #b8860b;
      --card: #1a1a2e;
      --card2: #16213e;
      --green: #2ecc71;
      --red: #e74c3c;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(ellipse at top, #1a1a2e 0%, #0f0f1a 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 12px;
      user-select: none;
      overflow-x: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding: 12px 16px;
      background: linear-gradient(135deg, #1e1e3a, #16213e);
      border-radius: 16px;
      border: 1px solid rgba(245,197,66,0.2);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .balance {
      font-size: 18px;
      font-weight: 700;
    }
    .balance span { color: var(--gold); text-shadow: 0 0 10px rgba(245,197,66,0.5); }
    .user {
      font-size: 13px;
      color: var(--hint);
      max-width: 40%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      background: #1a1a2e;
      padding: 6px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .tab {
      flex: 1;
      padding: 10px 4px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--hint);
      border: none;
      background: transparent;
    }
    .tab.active {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #0f0f1a;
      box-shadow: 0 4px 12px rgba(245,197,66,0.3);
    }
    .game { display: none; }
    .game.active { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* === СЛОТЫ === */
    .slots-wrap {
      background: linear-gradient(145deg, #1e1e3a, #16213e);
      border-radius: 20px;
      padding: 14px;
      border: 2px solid rgba(245,197,66,0.3);
      box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 0 30px rgba(245,197,66,0.05);
      margin-bottom: 14px;
      position: relative;
    }
    .slots-wrap::before, .slots-wrap::after {
      content: '✨';
      position: absolute;
      font-size: 20px;
      animation: twinkle 2s infinite;
    }
    .slots-wrap::before { top: 8px; left: 10px; }
    .slots-wrap::after { top: 8px; right: 10px; animation-delay: 1s; }
    @keyframes twinkle { 0%,100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

    .reels {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 12px;
    }
    .reel {
      background: #0a0a14;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 6px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.9), 0 0 0 1px rgba(245,197,66,0.15);
      overflow: hidden;
      position: relative;
    }
    .cell {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      background: rgba(255,255,255,0.02);
      border-radius: 8px;
      transition: background 0.2s;
    }
    .cell.spinning { animation: blur 0.08s linear infinite; }
    @keyframes blur { 0% { opacity: 0.4; transform: translateY(-3px); } 50% { opacity: 1; } 100% { opacity: 0.4; transform: translateY(3px); } }
    .cell.win-cell {
      background: rgba(245,197,66,0.25);
      box-shadow: 0 0 15px rgba(245,197,66,0.8), inset 0 0 10px rgba(245,197,66,0.5);
      animation: winPulse 0.5s ease infinite alternate;
    }
    @keyframes winPulse { from { transform: scale(1); } to { transform: scale(1.08); } }

    .paylines-info {
      font-size: 11px;
      color: var(--hint);
      text-align: center;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .paylines-info b { color: var(--gold); }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }
    .bet-control {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #0a0a14;
      border-radius: 12px;
      padding: 6px;
      border: 1px solid rgba(245,197,66,0.2);
    }
    .bet-control button {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: none;
      background: #2a2a4a;
      color: var(--gold);
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
    .bet-control button:active { background: var(--gold); color: #0f0f1a; }
    .bet-control .bet-val {
      min-width: 50px;
      text-align: center;
      font-weight: 700;
      color: var(--gold);
      font-size: 15px;
    }
    .spin-btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #0f0f1a;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 0 #7a5a08, 0 8px 20px rgba(245,197,66,0.3);
      transition: all 0.1s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .spin-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #7a5a08; }
    .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .message {
      text-align: center;
      min-height: 24px;
      font-size: 15px;
      font-weight: 700;
      margin-top: 8px;
    }
    .message.win { color: var(--gold); text-shadow: 0 0 12px rgba(245,197,66,0.6); }
    .message.lose { color: var(--red); }

    /* === КОЛЕСО === */
    .wheel-wrap {
      text-align: center;
      padding: 20px;
    }
    .wheel-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 0 auto 20px;
    }
    .wheel {
      width: 100%; height: 100%;
      border-radius: 50%;
      border: 6px solid var(--gold);
      box-shadow: 0 0 30px rgba(245,197,66,0.4), inset 0 0 30px rgba(0,0,0,0.5);
      transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
      background: conic-gradient(
        #e74c3c 0deg 45deg, #f39c12 45deg 90deg,
        #2ecc71 90deg 135deg, #3498db 135deg 180deg,
        #9b59b6 180deg 225deg, #e74c3c 225deg 270deg,
        #f5c542 270deg 315deg, #1abc9c 315deg 360deg
      );
      position: relative;
    }
    .wheel-center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 60px; height: 60px;
      background: var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      z-index: 2;
    }
    .wheel-pointer {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 36px;
      z-index: 3;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    }

    /* === МИНЫ === */
    .mines-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }
    .mine-cell {
      aspect-ratio: 1;
      background: linear-gradient(145deg, #2a2a4a, #1a1a2e);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.05);
      transition: all 0.15s;
    }
    .mine-cell:active { transform: scale(0.92); }
    .mine-cell.opened { background: #0a0a14; cursor: default; }
    .mine-cell.gem { background: linear-gradient(145deg, #2ecc71, #27ae60); }
    .mine-cell.mine { background: linear-gradient(145deg, #e74c3c, #c0392b); }

    /* === КОСТИ === */
    .dice-wrap { text-align: center; padding: 20px; }
    .dice {
      display: inline-flex;
      gap: 20px;
      margin: 20px 0;
      font-size: 64px;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.6));
    }
    .dice.rolling { animation: roll 0.4s ease infinite; }
    @keyframes roll { 0%,100% { transform: rotate(-10deg) translateY(0); } 50% { transform: rotate(10deg) translateY(-8px); } }

    .common-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #0f0f1a;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 0 #7a5a08;
      margin-top: 8px;
    }
    .common-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #7a5a08; }
    .common-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .particles {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      font-size: 24px;
      animation: fall 1.5s ease-out forwards;
    }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="balance">💰 <span id="balance">1000</span></div>
    <div class="user" id="userName">Игрок</div>
  </div>

  <div class="tabs">
    <button class="tab active" data-game="slots">🎰 Слоты</button>
    <button class="tab" data-game="wheel">🎡 Колесо</button>
    <button class="tab" data-game="mines">💎 Мины</button>
    <button class="tab" data-game="dice">🎲 Кости</button>
  </div>

  <!-- СЛОТЫ -->
  <div class="game active" id="game-slots">
    <div class="slots-wrap">
      <div class="reels" id="reels"></div>
      <div class="paylines-info">
        Линии: <b>3 в ряд</b> (×2), <b>4 в ряд</b> (×5), <b>5 в ряд</b> (×20)
      </div>
      <div class="controls">
        <div class="bet-control">
          <button id="betMinus">−</button>
          <div class="bet-val" id="betVal">10</div>
          <button id="betPlus">+</button>
        </div>
        <button class="spin-btn" id="spinBtn">Крутить</button>
      </div>
      <div class="message" id="slotsMsg"></div>
    </div>
  </div>

  <!-- КОЛЕСО -->
  <div class="game" id="game-wheel">
    <div class="slots-wrap wheel-wrap">
      <div class="wheel-container">
        <div class="wheel-pointer">🔻</div>
        <div class="wheel" id="wheel"></div>
        <div class="wheel-center">🎡</div>
      </div>
      <div class="controls">
        <div class="bet-control">
          <button id="wheelBetMinus">−</button>
          <div class="bet-val" id="wheelBetVal">10</div>
          <button id="wheelBetPlus">+</button>
        </div>
        <button class="spin-btn" id="wheelSpinBtn">Вращать</button>
      </div>
      <div class="message" id="wheelMsg"></div>
    </div>
  </div>

  <!-- МИНЫ -->
  <div class="game" id="game-mines">
    <div class="slots-wrap">
      <div class="mines-grid" id="minesGrid"></div>
      <div class="message" id="minesMsg"></div>
      <button class="common-btn" id="minesStartBtn">Начать (ставка 50)</button>
      <button class="common-btn" id="minesCashBtn" style="display:none">Забрать</button>
    </div>
  </div>

  <!-- КОСТИ -->
  <div class="game" id="game-dice">
    <div class="slots-wrap dice-wrap">
      <div class="dice" id="dice">🎲🎲</div>
      <div class="controls">
        <div class="bet-control">
          <button id="diceBetMinus">−</button>
          <div class="bet-val" id="diceBetVal">10</div>
          <button id="diceBetPlus">+</button>
        </div>
        <button class="spin-btn" id="diceRollBtn">Бросить</button>
      </div>
      <div class="message" id="diceMsg"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor?.('#0f0f1a');
      tg.setBackgroundColor?.('#0f0f1a');
      const u = tg.initDataUnsafe?.user;
      if (u) document.getElementById('userName').textContent = u.first_name || 'Игрок';
    }

    // === СОСТОЯНИЕ ===
    let balance = parseInt(localStorage.getItem('casino_balance')) || 1000;
    const balanceEl = document.getElementById('balance');
    function updateBalance() {
      balanceEl.textContent = balance;
      localStorage.setItem('casino_balance', balance);
    }
    updateBalance();

    function haptic(type) {
      if (!tg?.HapticFeedback) return;
      if (type === 'win') tg.HapticFeedback.notificationOccurred('success');
      else if (type === 'lose') tg.HapticFeedback.notificationOccurred('error');
      else tg.HapticFeedback.impactOccurred('light');
    }

    function particles(count = 15) {
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particles';
        p.textContent = ['⭐','✨','💫','🌟'][Math.floor(Math.random()*4)];
        p.style.left = Math.random() * 100 + 'vw';
        p.style.top = '-30px';
        p.style.animationDelay = Math.random() * 0.3 + 's';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1800);
      }
    }

    // === ВКЛАДКИ ===
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.game').forEach(g => g.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('game-' + tab.dataset.game).classList.add('active');
        haptic('click');
      });
    });

    // === СЛОТЫ ===
    const SYMBOLS = [
      { e: '🍒', w: 30 }, { e: '🍋', w: 25 }, { e: '🍊', w: 20 },
      { e: '⭐', w: 12 }, { e: '💎', w: 8 }, { e: '7️⃣', w: 4 }, { e: '👑', w: 1 }
    ];
    const PAY = { '🍒': 2, '🍋': 3, '🍊': 4, '⭐': 6, '💎': 10, '7️⃣': 25, '👑': 100 };
    const WEIGHTED = [];
    SYMBOLS.forEach(s => { for (let i=0;i<s.w;i++) WEIGHTED.push(s.e); });
    function randSym() { return WEIGHTED[Math.floor(Math.random()*WEIGHTED.length)]; }

    let bet = 10;
    const betValEl = document.getElementById('betVal');
    const spinBtn = document.getElementById('spinBtn');
    const reelsEl = document.getElementById('reels');
    const slotsMsg = document.getElementById('slotsMsg');
    let spinning = false;

    function updateBet() {
      betValEl.textContent = bet;
      spinBtn.textContent = `Крутить (${bet})`;
      spinBtn.disabled = spinning || balance < bet;
    }
    document.getElementById('betMinus').onclick = () => { if (bet > 10) { bet -= 10; updateBet(); haptic('click'); } };
    document.getElementById('betPlus').onclick = () => { if (bet + 10 <= balance) { bet += 10; updateBet(); haptic('click'); } };

    function buildReels() {
      reelsEl.innerHTML = '';
      for (let col = 0; col < 5; col++) {
        const reel = document.createElement('div');
        reel.className = 'reel';
        for (let row = 0; row < 3; row++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.textContent = randSym();
          reel.appendChild(cell);
        }
        reelsEl.appendChild(reel);
      }
    }
    buildReels();

    function checkWins(grid) {
      let totalWin = 0;
      const winCells = new Set();
      // Горизонтали (3 строки)
      for (let row = 0; row < 3; row++) {
        let run = 1;
        for (let col = 1; col < 5; col++) {
          if (grid[col][row] === grid[col-1][row]) run++;
          else break;
        }
        if (run >= 3) {
          const sym = grid[0][row];
          const mult = PAY[sym] || 0;
          const lineWin = bet * mult * (run === 3 ? 1 : run === 4 ? 2 : 4);
          totalWin += lineWin;
          for (let c = 0; c < run; c++) winCells.add(`${c}-${row}`);
        }
      }
      // Вертикали — 5 в ряд (уже покрыто горизонталями, но для вертикали нужно 5 одинаковых в столбце? нет — 3 в ряд по вертикали)
      // Диагонали
      const diagDown = [grid[0][0], grid[1][1], grid[2][2], grid[3][0], grid[4][1]];
      // Упростим: проверяем только полные диагонали из 3+
      for (let startRow = 0; startRow < 3; startRow++) {
        // диагональ вниз
        let run = 1;
        for (let i = 1; i < 3; i++) {
          const c = i, r = startRow + i;
          if (r < 3 && grid[c][r] === grid[c-1][r-1]) run++; else break;
        }
        if (run >= 3) {
          const sym = grid[0][startRow];
          totalWin += bet * (PAY[sym] || 0) * 2;
          for (let i = 0; i < run; i++) winCells.add(`${i}-${startRow+i}`);
        }
      }
      return { totalWin, winCells };
    }

    spinBtn.onclick = () => {
      if (spinning || balance < bet) return;
      spinning = true;
      balance -= bet;
      updateBalance();
      slotsMsg.textContent = '';
      slotsMsg.className = 'message';
      document.querySelectorAll('.cell').forEach(c => { c.classList.remove('win-cell'); c.classList.add('spinning'); });
      haptic('click');

      const targetGrid = [];
      for (let col = 0; col < 5; col++) {
        targetGrid.push([randSym(), randSym(), randSym()]);
      }

      const cells = document.querySelectorAll('.cell');
      const intervals = [];
      for (let i = 0; i < 15; i++) {
        intervals[i] = setInterval(() => {
          cells[i].textContent = randSym();
        }, 60);
      }

      // Останавливаем колонки по очереди
      for (let col = 0; col < 5; col++) {
        setTimeout(() => {
          for (let row = 0; row < 3; row++) {
            const idx = col * 3 + row;
            clearInterval(intervals[idx]);
            cells[idx].classList.remove('spinning');
            cells[idx].textContent = targetGrid[col][row];
          }
          if (col === 4) finishSlots(targetGrid);
        }, 400 + col * 250);
      }
    };

    function finishSlots(grid) {
      spinning = false;
      const { totalWin, winCells } = checkWins(grid);
      if (totalWin > 0) {
        balance += totalWin;
        updateBalance();
        slotsMsg.textContent = `🎉 Выигрыш: +${totalWin}!`;
        slotsMsg.className = 'message win';
        winCells.forEach(k => {
          const [c, r] = k.split('-').map(Number);
          const idx = c * 3 + r;
          document.querySelectorAll('.cell')[idx]?.classList.add('win-cell');
        });
        haptic('win');
        particles(20);
      } else {
        slotsMsg.textContent = '😢 Не повезло';
        slotsMsg.className = 'message lose';
        haptic('lose');
      }
      updateBet();
    }

    // === КОЛЕСО ===
    const WHEEL_PRIZES = [2, 0, 5, 0, 10, 0, 3, 50]; // множители
    let wheelBet = 10;
    const wheelBetVal = document.getElementById('wheelBetVal');
    const wheelSpinBtn = document.getElementById('wheelSpinBtn');
    const wheelEl = document.getElementById('wheel');
    const wheelMsg = document.getElementById('wheelMsg');
    let wheelAngle = 0;
    let wheelSpinning = false;

    function updateWheelBet() {
      wheelBetVal.textContent = wheelBet;
      wheelSpinBtn.textContent = `Вращать (${wheelBet})`;
      wheelSpinBtn.disabled = wheelSpinning || balance < wheelBet;
    }
    document.getElementById('wheelBetMinus').onclick = () => { if (wheelBet > 10) { wheelBet -= 10; updateWheelBet(); haptic('click'); } };
    document.getElementById('wheelBetPlus').onclick = () => { if (wheelBet + 10 <= balance) { wheelBet += 10; updateWheelBet(); haptic('click'); } };

    wheelSpinBtn.onclick = () => {
      if (wheelSpinning || balance < wheelBet) return;
      wheelSpinning = true;
      balance -= wheelBet;
      updateBalance();
      wheelMsg.textContent = '';
      wheelMsg.className = 'message';
      haptic('click');

      const idx = Math.floor(Math.random() * WHEEL_PRIZES.length);
      const sectorAngle = 360 / WHEEL_PRIZES.length;
      const targetAngle = 360 * 5 + (360 - idx * sectorAngle - sectorAngle / 2);
      wheelAngle += targetAngle;
      wheelEl.style.transform = `rotate(${wheelAngle}deg)`;

      setTimeout(() => {
        const mult = WHEEL_PRIZES[idx];
        if (mult > 0) {
          const win = wheelBet * mult;
          balance += win;
          updateBalance();
          wheelMsg.textContent = `🎉 +${win} (×${mult})`;
          wheelMsg.className = 'message win';
          haptic('win');
          particles(15);
        } else {
          wheelMsg.textContent = '😢 Пусто';
          wheelMsg.className = 'message lose';
          haptic('lose');
        }
        wheelSpinning = false;
        updateWheelBet();
      }, 4100);
    };

    // === МИНЫ ===
    const MINES_COUNT = 3;
    const MINES_TOTAL = 25;
    let minesActive = false;
    let minesField = [];
    let minesOpened = 0;
    let minesBet = 50;
    const minesGrid = document.getElementById('minesGrid');
    const minesMsg = document.getElementById('minesMsg');
    const minesStartBtn = document.getElementById('minesStartBtn');
    const minesCashBtn = document.getElementById('minesCashBtn');

    function buildMinesGrid() {
      minesGrid.innerHTML = '';
      for (let i = 0; i < MINES_TOTAL; i++) {
        const cell = document.createElement('div');
        cell.className = 'mine-cell';
        cell.textContent = '';
        cell.dataset.idx = i;
        cell.onclick = () => openMine(i, cell);
        minesGrid.appendChild(cell);
      }
    }
    buildMinesGrid();

    function minesPayout() {
      // Чем больше открыто, тем выше множитель
      if (minesOpened === 0) return 0;
      const safe = MINES_TOTAL - MINES_COUNT;
      let mult = 1;
      for (let i = 0; i < minesOpened; i++) mult *= safe / (MINES_TOTAL - i);
      return Math.floor(minesBet * mult * 0.95);
    }

    minesStartBtn.onclick = () => {
      if (minesActive) return;
      if (balance < minesBet) { minesMsg.textContent = 'Недостаточно средств'; return; }
      balance -= minesBet;
      updateBalance();
      minesActive = true;
      minesOpened = 0;
      minesField = Array(MINES_TOTAL).fill('gem');
      let placed = 0;
      while (placed < MINES_COUNT) {
        const r = Math.floor(Math.random() * MINES_TOTAL);
        if (minesField[r] === 'gem') { minesField[r] = 'mine'; placed++; }
      }
      buildMinesGrid();
      minesMsg.textContent = 'Открывайте клетки!';
      minesMsg.className = 'message';
      minesStartBtn.style.display = 'none';
      minesCashBtn.style.display = 'block';
      minesCashBtn.textContent = 'Забрать 0';
      haptic('click');
    };

    function openMine(idx, cell) {
      if (!minesActive || cell.classList.contains('opened')) return;
      cell.classList.add('opened');
      if (minesField[idx] === 'mine') {
        cell.textContent = '💥';
        cell.classList.add('mine');
        minesActive = false;
        minesMsg.textContent = '💥 Взрыв! Вы проиграли';
        minesMsg.className = 'message lose';
        haptic('lose');
        // Показать все мины
        document.querySelectorAll('.mine-cell').forEach((c, i) => {
          if (minesField[i] === 'mine' && !c.classList.contains('opened')) {
            c.textContent = '💣';
            c.classList.add('opened');
          }
        });
        minesCashBtn.style.display = 'none';
        minesStartBtn.style.display = 'block';
      } else {
        cell.textContent = '💎';
        cell.classList.add('gem');
        minesOpened++;
        const pay = minesPayout();
        minesCashBtn.textContent = `Забрать ${pay}`;
        minesMsg.textContent = `Безопасно! Открыто: ${minesOpened}`;
        minesMsg.className = 'message win';
        haptic('click');
        if (minesOpened === MINES_TOTAL - MINES_COUNT) {
          // Все безопасные открыты — авто-кэшаут
          balance += pay;
          updateBalance();
          minesMsg.textContent = `🎉 Все безопасные! +${pay}`;
          minesActive = false;
          minesCashBtn.style.display = 'none';
          minesStartBtn.style.display = 'block';
          particles(20);
        }
      }
    }

    minesCashBtn.onclick = () => {
      if (!minesActive) return;
      const pay = minesPayout();
      balance += pay;
      updateBalance();
      minesMsg.textContent = `💰 Забрано: +${pay}`;
      minesMsg.className = 'message win';
      minesActive = false;
      minesCashBtn.style.display = 'none';
      minesStartBtn.style.display = 'block';
      haptic('win');
      particles(15);
    };

    // === КОСТИ ===
    const DICE_FACES = ['⚀','⚁','⚂','⚃','⚄','⚅'];
    let diceBet = 10;
    const diceBetVal = document.getElementById('diceBetVal');
    const diceEl = document.getElementById('dice');
    const diceMsg = document.getElementById('diceMsg');
    const diceRollBtn = document.getElementById('diceRollBtn');
    let diceRolling = false;

    function updateDiceBet() {
      diceBetVal.textContent = diceBet;
      diceRollBtn.textContent = `Бросить (${diceBet})`;
      diceRollBtn.disabled = diceRolling || balance < diceBet;
    }
    document.getElementById('diceBetMinus').onclick = () => { if (diceBet > 10) { diceBet -= 10; updateDiceBet(); haptic('click'); } };
    document.getElementById('diceBetPlus').onclick = () => { if (diceBet + 10 <= balance) { diceBet += 10; updateDiceBet(); haptic('click'); } };

    diceRollBtn.onclick = () => {
      if (diceRolling || balance < diceBet) return;
      diceRolling = true;
      balance -= diceBet;
      updateBalance();
      diceMsg.textContent = '';
      diceMsg.className = 'message';
      diceEl.classList.add('rolling');
      haptic('click');

      let ticks = 0;
      const rollInterval = setInterval(() => {
        diceEl.textContent = DICE_FACES[Math.floor(Math.random()*6)] + DICE_FACES[Math.floor(Math.random()*6)];
        ticks++;
        if (ticks > 12) {
          clearInterval(rollInterval);
          diceEl.classList.remove('rolling');
          const d1 = Math.floor(Math.random()*6)+1;
          const d2 = Math.floor(Math.random()*6)+1;
          diceEl.textContent = DICE_FACES[d1-1] + DICE_FACES[d2-1];
          const sum = d1 + d2;
          let win = 0;
          if (sum === 7 || sum === 11) win = diceBet * 3;
          else if (d1 === d2) win = diceBet * 5;
          else if (sum === 2 || sum === 12) win = diceBet * 10;
          if (win > 0) {
            balance += win;
            updateBalance();
            diceMsg.textContent = `🎉 +${win} (сумма ${sum})`;
            diceMsg.className = 'message win';
            haptic('win');
            particles(12);
          } else {
            diceMsg.textContent = `Сумма ${sum}. Не повезло`;
            diceMsg.className = 'message lose';
            haptic('lose');
          }
          diceRolling = false;
          updateDiceBet();
        }
      }, 80);
    };

    updateBet();
    updateWheelBet();
    updateDiceBet();
  </script>
</body>
</html>
