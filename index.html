<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Casino Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: var(--tg-theme-bg-color, #0f0f1a);
  --text: var(--tg-theme-text-color, #fff);
  --hint: var(--tg-theme-hint-color, #8a8a9a);
  --gold: #f5c542;
  --gold-dark: #b8860b;
  --card: #1a1a2e;
  --card2: #16213e;
  --green: #2ecc71;
  --red: #e74c3c;
  --purple: #9b59b6;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: radial-gradient(ellipse at top, #1a1a2e 0%, #0f0f1a 100%);
  color: var(--text);
  min-height: 100vh;
  padding: 12px;
  user-select: none;
  overflow-x: hidden;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding: 12px 16px;
  background: linear-gradient(135deg, #1e1e3a, #16213e);
  border-radius: 16px;
  border: 1px solid rgba(245,197,66,0.2);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  position: sticky;
  top: 0;
  z-index: 100;
}
.balance { font-size: 18px; font-weight: 700; }
.balance span { color: var(--gold); text-shadow: 0 0 10px rgba(245,197,66,0.5); }
.user { font-size: 13px; color: var(--hint); max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.tabs {
  display: flex; gap: 4px; margin-bottom: 12px;
  background: #1a1a2e; padding: 5px; border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.05);
  overflow-x: auto;
}
.tab {
  flex: 1; min-width: 64px; padding: 10px 4px; text-align: center;
  font-size: 11px; font-weight: 600; border-radius: 10px;
  cursor: pointer; transition: all 0.2s; color: var(--hint);
  border: none; background: transparent; white-space: nowrap;
}
.tab.active {
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: #0f0f1a;
  box-shadow: 0 4px 12px rgba(245,197,66,0.3);
}
.game { display: none; }
.game.active { display: block; animation: fadeIn 0.3s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.panel {
  background: linear-gradient(145deg, #1e1e3a, #16213e);
  border-radius: 20px; padding: 14px;
  border: 2px solid rgba(245,197,66,0.3);
  box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 0 30px rgba(245,197,66,0.05);
  margin-bottom: 14px; position: relative;
}

/* Кнопка правил */
.rules-btn {
  position: absolute; top: 10px; right: 10px;
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(245,197,66,0.15);
  border: 1px solid rgba(245,197,66,0.4);
  color: var(--gold); font-size: 16px; font-weight: 700;
  cursor: pointer; z-index: 10;
  display: flex; align-items: center; justify-content: center;
}
.rules-btn:active { background: var(--gold); color: #0f0f1a; }

/* Модалка правил */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8);
  z-index: 1000; display: none; align-items: center; justify-content: center;
  padding: 20px; backdrop-filter: blur(4px);
}
.modal-overlay.show { display: flex; animation: fadeIn 0.2s; }
.modal {
  background: linear-gradient(145deg, #1e1e3a, #16213e);
  border-radius: 20px; padding: 20px; max-width: 400px; width: 100%;
  border: 2px solid var(--gold); max-height: 80vh; overflow-y: auto;
}
.modal h2 { color: var(--gold); margin-bottom: 12px; font-size: 20px; }
.modal p, .modal li { font-size: 14px; line-height: 1.6; margin-bottom: 8px; color: var(--text); }
.modal ul { padding-left: 20px; }
.modal .close-btn {
  width: 100%; padding: 12px; margin-top: 12px;
  border: none; border-radius: 12px;
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: #0f0f1a; font-weight: 700; font-size: 15px; cursor: pointer;
}

/* СЛОТЫ */
.reels {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 5px; margin-bottom: 12px;
}
.reel {
  background: #0a0a14; border-radius: 12px;
  display: flex; flex-direction: column; gap: 4px; padding: 5px;
  box-shadow: inset 0 0 15px rgba(0,0,0,0.9), 0 0 0 1px rgba(245,197,66,0.15);
  overflow: hidden; position: relative;
}
.cell {
  height: 48px; display: flex; align-items: center; justify-content: center;
  font-size: 28px; background: rgba(255,255,255,0.02);
  border-radius: 8px; transition: background 0.2s;
  position: relative;
}
.cell.spinning { animation: blurSpin 0.08s linear infinite; }
@keyframes blurSpin {
  0% { opacity: 0.4; transform: translateY(-4px); }
  50% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0.4; transform: translateY(4px); }
}
.cell.win-cell {
  background: rgba(245,197,66,0.3);
  box-shadow: 0 0 20px rgba(245,197,66,0.9), inset 0 0 12px rgba(245,197,66,0.6);
  animation: winPulse 0.4s ease infinite alternate;
  z-index: 2;
}
.cell.win-cell::after {
  content: ''; position: absolute; inset: 0;
  border-radius: 8px; border: 2px solid var(--gold);
  animation: borderGlow 0.8s ease infinite alternate;
}
@keyframes winPulse { from { transform: scale(1); } to { transform: scale(1.1); } }
@keyframes borderGlow { from { box-shadow: 0 0 5px var(--gold); } to { box-shadow: 0 0 20px var(--gold); } }

.paylines-info {
  font-size: 10px; color: var(--hint);
  text-align: center; margin-bottom: 10px; line-height: 1.5;
}
.paylines-info b { color: var(--gold); }

.controls { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.bet-control {
  display: flex; align-items: center; gap: 4px;
  background: #0a0a14; border-radius: 12px; padding: 6px;
  border: 1px solid rgba(245,197,66,0.2);
}
.bet-control button {
  width: 30px; height: 30px; border-radius: 8px; border: none;
  background: #2a2a4a; color: var(--gold); font-size: 16px; font-weight: 700; cursor: pointer;
}
.bet-control button:active { background: var(--gold); color: #0f0f1a; }
.bet-control .bet-val {
  min-width: 44px; text-align: center; font-weight: 700;
  color: var(--gold); font-size: 14px;
}
.spin-btn {
  flex: 1; padding: 14px; border: none; border-radius: 14px;
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: #0f0f1a; font-size: 16px; font-weight: 800; cursor: pointer;
  box-shadow: 0 5px 0 #7a5a08, 0 8px 20px rgba(245,197,66,0.3);
  transition: all 0.1s; text-transform: uppercase; letter-spacing: 1px;
}
.spin-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #7a5a08; }
.spin-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.message {
  text-align: center; min-height: 22px; font-size: 14px;
  font-weight: 700; margin-top: 8px;
  transition: all 0.3s;
}
.message.win { color: var(--gold); text-shadow: 0 0 12px rgba(245,197,66,0.6); animation: msgPop 0.4s; }
.message.lose { color: var(--red); }
@keyframes msgPop { 0% { transform: scale(0.8); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

/* КОЛЕСО */
.wheel-wrap { text-align: center; padding: 10px; }
.wheel-container {
  position: relative; width: 300px; height: 300px;
  margin: 10px auto 20px; max-width: 90vw; max-height: 90vw;
}
.wheel-svg { width: 100%; height: 100%; transition: transform 4s cubic-bezier(0.17,0.67,0.12,0.99); }
.wheel-center {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 60px; height: 60px; background: var(--gold); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 2;
}
.wheel-pointer {
  position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
  font-size: 40px; z-index: 3; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
  animation: pointerBounce 0.5s ease infinite alternate;
}
@keyframes pointerBounce { from { transform: translateX(-50%) translateY(0); } to { transform: translateX(-50%) translateY(-3px); } }

/* МИНЫ */
.mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 12px; }
.mine-cell {
  aspect-ratio: 1; background: linear-gradient(145deg, #2a2a4a, #1a1a2e);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 22px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05);
  transition: all 0.15s;
}
.mine-cell:active { transform: scale(0.92); }
.mine-cell.opened { background: #0a0a14; cursor: default; }
.mine-cell.gem {
  background: linear-gradient(145deg, #2ecc71, #27ae60);
  box-shadow: 0 0 12px rgba(46,204,113,0.5);
  animation: gemPop 0.3s;
}
.mine-cell.mine {
  background: linear-gradient(145deg, #e74c3c, #c0392b);
  box-shadow: 0 0 15px rgba(231,76,60,0.7);
  animation: mineShake 0.5s;
}
@keyframes gemPop { 0% { transform: scale(0); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
@keyframes mineShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

/* КОСТИ */
.dice-wrap { text-align: center; padding: 20px 10px; }
.dice {
  display: flex; justify-content: center; gap: 20px; margin: 20px 0;
}
.die {
  width: 80px; height: 80px; background: #fff; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 0 #888, 0 10px 20px rgba(0,0,0,0.5);
  position: relative; transition: all 0.1s;
}
.die.rolling { animation: dieRoll 0.15s linear infinite; }
@keyframes dieRoll {
  0% { transform: rotate(0deg) translateY(0); }
  25% { transform: rotate(15deg) translateY(-5px); }
  50% { transform: rotate(-15deg) translateY(0); }
  75% { transform: rotate(10deg) translateY(-3px); }
  100% { transform: rotate(0deg) translateY(0); }
}
.die-face {
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
  gap: 4px; padding: 10px; width: 100%; height: 100%;
}
.pip {
  width: 100%; height: 100%; border-radius: 50%;
  background: #1a1a2e; display: none;
}
.pip.on { display: block; }

/* РУЛЕТКА */
.roulette-wrap { text-align: center; padding: 10px; }
.roulette-history {
  display: flex; gap: 4px; justify-content: center;
  margin-bottom: 12px; flex-wrap: wrap; min-height: 30px;
}
.history-num {
  width: 28px; height: 28px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: #fff;
  animation: historyIn 0.4s;
}
@keyframes historyIn { from { transform: scale(0) rotate(-180deg); } to { transform: scale(1) rotate(0); } }
.history-num.red { background: #e74c3c; }
.history-num.black { background: #2c2c3c; }
.history-num.green { background: #27ae60; }

.roulette-display {
  background: linear-gradient(145deg, #0a0a14, #1a1a2e);
  border-radius: 20px; padding: 30px 10px; margin-bottom: 14px;
  border: 3px solid var(--gold);
  box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 0 20px rgba(245,197,66,0.2);
  min-height: 100px; display: flex; align-items: center; justify-content: center;
}
.roulette-result {
  font-size: 64px; font-weight: 900;
  transition: all 0.3s;
}
.roulette-result.spinning-text { animation: textFlicker 0.08s linear infinite; }
@keyframes textFlicker { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
.roulette-result.red { color: #e74c3c; text-shadow: 0 0 20px #e74c3c; }
.roulette-result.black { color: #fff; text-shadow: 0 0 20px #888; }
.roulette-result.green { color: #27ae60; text-shadow: 0 0 20px #27ae60; }

.roulette-bets {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 6px; margin-bottom: 10px;
}
.roulette-bet-btn {
  padding: 14px 6px; border: 2px solid rgba(255,255,255,0.1);
  border-radius: 12px; background: #1a1a2e; color: var(--text);
  font-size: 13px; font-weight: 700; cursor: pointer;
  transition: all 0.2s; text-align: center;
}
.roulette-bet-btn.selected {
  border-color: var(--gold); background: rgba(245,197,66,0.2);
  box-shadow: 0 0 15px rgba(245,197,66,0.4);
}
.roulette-bet-btn[data-bet="red"] { background: linear-gradient(145deg, #e74c3c, #c0392b); }
.roulette-bet-btn[data-bet="black"] { background: linear-gradient(145deg, #2c2c3c, #1a1a2e); }
.roulette-bet-btn[data-bet="green"] { background: linear-gradient(145deg, #27ae60, #1e8449); }

.roulette-numbers {
  display: grid; grid-template-columns: repeat(6, 1fr);
  gap: 3px; margin-bottom: 12px;
  max-height: 200px; overflow-y: auto;
}
.rou-num {
  aspect-ratio: 1; border-radius: 6px; border: none;
  font-size: 12px; font-weight: 700; color: #fff; cursor: pointer;
  transition: all 0.15s;
}
.rou-num.red { background: #e74c3c; }
.rou-num.black { background: #2c2c3c; }
.rou-num.green { background: #27ae60; }
.rou-num.selected { outline: 3px solid var(--gold); transform: scale(1.1); z-index: 2; }

.common-btn {
  width: 100%; padding: 14px; border: none; border-radius: 12px;
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: #0f0f1a; font-size: 15px; font-weight: 700; cursor: pointer;
  box-shadow: 0 4px 0 #7a5a08; margin-top: 8px;
  transition: all 0.1s;
}
.common-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #7a5a08; }
.common-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* УЛУЧШЕНИЯ */
.upgrade-section {
  margin-top: 14px; padding-top: 14px;
  border-top: 1px dashed rgba(245,197,66,0.2);
}
.upgrade-title {
  font-size: 13px; color: var(--gold); font-weight: 700;
  margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
}
.upgrade-item {
  display: flex; align-items: center; gap: 10px;
  background: #0a0a14; border-radius: 12px; padding: 10px 12px;
  margin-bottom: 8px; border: 1px solid rgba(245,197,66,0.15);
  transition: all 0.2s;
}
.upgrade-item.owned {
  border-color: var(--gold);
  background: linear-gradient(135deg, rgba(245,197,66,0.15), rgba(245,197,66,0.05));
  box-shadow: 0 0 15px rgba(245,197,66,0.2);
}
.upgrade-item.owned .upgrade-icon { animation: goldGlow 1.5s ease infinite alternate; }
@keyframes goldGlow { from { filter: drop-shadow(0 0 3px var(--gold)); } to { filter: drop-shadow(0 0 10px var(--gold)); } }
.upgrade-icon { font-size: 22px; }
.upgrade-info { flex: 1; }
.upgrade-name { font-size: 13px; font-weight: 700; }
.upgrade-desc { font-size: 10px; color: var(--hint); margin-top: 2px; }
.upgrade-buy {
  padding: 6px 12px; border: none; border-radius: 8px;
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: #0f0f1a; font-size: 11px; font-weight: 700; cursor: pointer;
  white-space: nowrap;
}
.upgrade-buy:disabled { opacity: 0.5; cursor: not-allowed; }
.upgrade-buy.owned { background: var(--green); }

/* Эффект золотого свечения для улучшенных игр */
.golden-mode .panel {
  border-color: var(--gold);
  box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 0 40px rgba(245,197,66,0.15), 0 0 30px rgba(245,197,66,0.3);
}
.golden-mode .cell { text-shadow: 0 0 15px rgba(245,197,66,0.8); }

.particles {
  position: fixed; pointer-events: none; z-index: 9999;
  font-size: 24px; animation: fall 1.5s ease-out forwards;
}
@keyframes fall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

.coin-fly {
  position: fixed; pointer-events: none; z-index: 9999;
  font-size: 20px; animation: coinFly 0.8s ease-out forwards;
}
@keyframes coinFly {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  100% { transform: translateY(-150px) scale(0.5); opacity: 0; }
}
</style>
</head>
<body>
<div class="header">
  <div class="balance">💰 <span id="balance">1000</span></div>
  <div class="user" id="userName">Игрок</div>
</div>

<div class="tabs">
  <button class="tab active" data-game="slots">🎰 Слоты</button>
  <button class="tab" data-game="wheel">🎡 Колесо</button>
  <button class="tab" data-game="mines">💎 Мины</button>
  <button class="tab" data-game="dice">🎲 Кости</button>
  <button class="tab" data-game="roulette">🎯 Рулетка</button>
</div>

<!-- СЛОТЫ -->
<div class="game active" id="game-slots">
  <div class="panel">
    <button class="rules-btn" onclick="showRules('slots')">?</button>
    <div class="reels" id="reels"></div>
    <div class="paylines-info">
      Выигрыш: <b>3 в ряд</b> (×1) · <b>4 в ряд</b> (×2) · <b>5 в ряд</b> (×4)<br>
      Множители: 🍒×2 🍋×3 🍊×4 ⭐×6 💎×10 7️⃣×25 👑×100
    </div>
    <div class="controls">
      <div class="bet-control">
        <button id="betMinus">−</button>
        <div class="bet-val" id="betVal">10</div>
        <button id="betPlus">+</button>
      </div>
      <button class="spin-btn" id="spinBtn">Крутить</button>
    </div>
    <div class="message" id="slotsMsg"></div>
    <div class="upgrade-section" id="slotsUpgrades"></div>
  </div>
</div>

<!-- КОЛЕСО -->
<div class="game" id="game-wheel">
  <div class="panel wheel-wrap">
    <button class="rules-btn" onclick="showRules('wheel')">?</button>
    <div class="wheel-container">
      <div class="wheel-pointer">🔻</div>
      <svg class="wheel-svg" id="wheelSvg" viewBox="0 0 200 200"></svg>
      <div class="wheel-center">🎡</div>
    </div>
    <div class="controls">
      <div class="bet-control">
        <button id="wheelBetMinus">−</button>
        <div class="bet-val" id="wheelBetVal">10</div>
        <button id="wheelBetPlus">+</button>
      </div>
      <button class="spin-btn" id="wheelSpinBtn">Вращать</button>
    </div>
    <div class="message" id="wheelMsg"></div>
    <div class="upgrade-section" id="wheelUpgrades"></div>
  </div>
</div>

<!-- МИНЫ -->
<div class="game" id="game-mines">
  <div class="panel">
    <button class="rules-btn" onclick="showRules('mines')">?</button>
    <div class="mines-grid" id="minesGrid"></div>
    <div class="message" id="minesMsg"></div>
    <button class="common-btn" id="minesStartBtn">Начать (ставка 50)</button>
    <button class="common-btn" id="minesCashBtn" style="display:none">Забрать</button>
    <div class="upgrade-section" id="minesUpgrades"></div>
  </div>
</div>

<!-- КОСТИ -->
<div class="game" id="game-dice">
  <div class="panel dice-wrap">
    <button class="rules-btn" onclick="showRules('dice')">?</button>
    <div class="dice">
      <div class="die" id="die1"><div class="die-face" id="face1"></div></div>
      <div class="die" id="die2"><div class="die-face" id="face2"></div></div>
    </div>
    <div class="controls">
      <div class="bet-control">
        <button id="diceBetMinus">−</button>
        <div class="bet-val" id="diceBetVal">10</div>
        <button id="diceBetPlus">+</button>
      </div>
      <button class="spin-btn" id="diceRollBtn">Бросить</button>
    </div>
    <div class="message" id="diceMsg"></div>
    <div class="upgrade-section" id="diceUpgrades"></div>
  </div>
</div>

<!-- РУЛЕТКА -->
<div class="game" id="game-roulette">
  <div class="panel roulette-wrap">
    <button class="rules-btn" onclick="showRules('roulette')">?</button>
    <div class="roulette-history" id="rouletteHistory"></div>
    <div class="roulette-display">
      <div class="roulette-result" id="rouletteResult">?</div>
    </div>
    <div class="roulette-bets">
      <button class="roulette-bet-btn" data-bet="red">КРАСНОЕ ×2</button>
      <button class="roulette-bet-btn" data-bet="black">ЧЁРНОЕ ×2</button>
      <button class="roulette-bet-btn" data-bet="green">ЗЕРО ×14</button>
    </div>
    <div class="roulette-numbers" id="rouletteNumbers"></div>
    <div class="controls">
      <div class="bet-control">
        <button id="rouBetMinus">−</button>
        <div class="bet-val" id="rouBetVal">10</div>
        <button id="rouBetPlus">+</button>
      </div>
      <button class="spin-btn" id="rouSpinBtn">Крутить</button>
    </div>
    <div class="message" id="rouMsg"></div>
    <div class="upgrade-section" id="rouUpgrades"></div>
  </div>

const SYMBOLS = [
  { e: '🍒', w: 30, m: 2 }, { e: '🍋', w: 25, m: 3 }, { e: '🍊', w: 20, m: 4 },
  { e: '⭐', w: 12, m: 6 }, { e: '💎', w: 8, m: 10 }, { e: '7️⃣', w: 4, m: 25 }, { e: '👑', w: 1, m: 100 }
];

function getWeights() {
  const luckBonus = hasUpgrade('slots_luck') ? 1.3 : 1;
  return SYMBOLS.map(s => ({
    e: s.e, m: s.m,
    w: s.w <= 12 ? Math.floor(s.w * luckBonus) : s.w
  }));
}

function randSym() {
  const weights = getWeights();
  const total = weights.reduce((a, b) => a + b.w, 0);
  let r = Math.random() * total;
  for (const s of weights) {
    if (r < s.w) return s.e;
    r -= s.w;
  }
  return weights[0].e;
}

function getMult(sym) {
  const s = SYMBOLS.find(x => x.e === sym);
  return s ? s.m : 0;
}

// ✅ ИСПРАВЛЕННАЯ ЛОГИКА ВЫИГРЫША
// Проверяет все горизонтальные линии (3 строки) и все диагонали из 5 клеток
function checkWins(grid) {
  // grid[col][row], col 0..4, row 0..2
  let totalWin = 0;
  const winCells = new Set();

  function evaluateLine(cells) {
    // cells — массив {col, row}
    // Проверяем линии слева направо: первые 3, 4 или 5 одинаковых подряд
    let best = null;
    for (let len = 5; len >= 3; len--) {
      // проверяем все окна длины len
      for (let start = 0; start <= cells.length - len; start++) {
        const first = grid[cells[start].col][cells[start].row];
        let ok = true;
        for (let i = 1; i < len; i++) {
          if (grid[cells[start+i].col][cells[start+i].row] !== first) { ok = false; break; }
        }
        if (ok) {
          const mult = getMult(first);
          if (mult > 0) {
            const lenBonus = len === 3 ? 1 : len === 4 ? 2 : 4;
            const win = bet * mult * lenBonus;
            if (!best || win > best.win) {
              best = { win, len, cells: cells.slice(start, start+len), sym: first };
            }
          }
        }
      }
    }
    if (best) {
      totalWin += best.win;
      best.cells.forEach(c => winCells.add(`${c.col}-${c.row}`));
    }
  }

  // 3 горизонтали
  for (let row = 0; row < 3; row++) {
    const cells = [];
    for (let col = 0; col < 5; col++) cells.push({ col, row });
    evaluateLine(cells);
  }

  // 2 диагонали (из левого верхнего и левого нижнего угла)
  const diag1 = [{col:0,row:0},{col:1,row:1},{col:2,row:2}];
  const diag2 = [{col:0,row:2},{col:1,row:1},{col:2,row:0}];
  evaluateLine(diag1);
  evaluateLine(diag2);

  return { totalWin, winCells };
}

function finishSlots(grid) {

// 12 секторов, веса подобраны для баланса
const WHEEL_SECTORS = [
  { mult: 0, weight: 25, color: '#2c2c3c' },
  { mult: 2, weight: 20, color: '#3498db' },
  { mult: 0, weight: 20, color: '#2c2c3c' },

  { mult: 0, weight: 8, color: '#2c2c3c' },
  { mult: 50, weight: 1, color: '#f5c542' },
  { mult: 0, weight: 5, color: '#2c2c3c' },
  { mult: 2, weight: 10, color: '#3498db' }
];

const WHEEL_WEIGHTED = [];
WHEEL_SECTORS.forEach((s, idx) => {
  for (let i = 0; i < s.weight; i++) WHEEL_WEIGHTED.push(idx);
});

function drawWheel() {
  const svg = document.getElementById('wheelSvg');
  const cx = 100, cy = 100, r = 95;
  const n = WHEEL_SECTORS.length;
  const anglePer = 360 / n;
  let html = '';
  for (let i = 0; i < n; i++) {
    const startAngle = i * anglePer - 90;
    const endAngle = startAngle + anglePer;
    const startRad = startAngle * Math.PI / 180;
    const endRad = endAngle * Math.PI / 180;
    const x1 = cx + r * Math.cos(startRad);
    const y1 = cy + r * Math.sin(startRad);
    const x2 = cx + r * Math.cos(endRad);
    const y2 = cy + r * Math.sin(endRad);
    const largeArc = anglePer > 180 ? 1 : 0;
    const path = `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z`;
    const midAngle = (startAngle + endAngle) / 2;
    const midRad = midAngle * Math.PI / 180;
    const tx = cx + (r * 0.65) * Math.cos(midRad);
    const ty = cy + (r * 0.65) * Math.sin(midRad);
    const mult = WHEEL_SECTORS[i].mult;
    const label = mult === 0 ? '✕' : '×' + mult;
    html += `<path d="${path}" fill="${WHEEL_SECTORS[i].color}" stroke="#0f0f1a" stroke-width="1"/>`;
    html += `<text x="${tx}" y="${ty}" fill="#fff" font-size="10" font-weight="900" text-anchor="middle" dominant-baseline="middle" transform="rotate(${midAngle + 90} ${tx} ${ty})">${label}</text>`;
  }
  svg.innerHTML = html;
}

  const anglePer = 360 / WHEEL_SECTORS.length;
  // сектор sectorIdx находится в диапазоне [sectorIdx*anglePer, (sectorIdx+1)*anglePer)
  // указатель сверху (-90°). Нужно повернуть так, чтобы середина сектора оказалась под указателем
  const targetSectorCenter = sectorIdx * anglePer + anglePer / 2;

  }
}
buildMinesGrid();

function minesPayout() {
  if (minesOpened === 0) return 0;
  const minesCount = getMinesCount();
  const safe = MINES_TOTAL - minesCount;
  let mult = 1;
  for (let i = 0; i < minesOpened; i++) mult *= safe / (MINES_TOTAL - i);
  return Math.floor(minesBet * mult * 0.95);
}

minesStartBtn.onclick = () => {
  if (minesActive) return;
  if (balance < minesBet) { minesMsg.textContent = 'Недостаточно средств'; minesMsg.className = 'message lose'; return; }
  balance -= minesBet;
  updateBalance();
  minesActive = true;
  minesOpened = 0;
  minesField = Array(MINES_TOTAL).fill('gem');
  const minesCount = getMinesCount();
  let placed = 0;
  while (placed < minesCount) {
    const r = Math.floor(Math.random() * MINES_TOTAL);
    if (minesField[r] === 'gem') { minesField[r] = 'mine'; placed++; }
  }
  buildMinesGrid();
  minesMsg.textContent = 'Открывайте клетки!';
  minesMsg.className = 'message';
  minesStartBtn.style.display = 'none';
  minesCashBtn.style.display = 'block';
  minesCashBtn.textContent = 'Забрать 0';
  haptic('click');
};

function openMine(idx, cell) {
  if (!minesActive || cell.classList.contains('opened')) return;
  cell.classList.add('opened');
  if (minesField[idx] === 'mine') {
    cell.textContent = '💥';
    cell.classList.add('mine');
    minesActive = false;
    minesMsg.textContent = '💥 Взрыв! Вы проиграли';
    minesMsg.className = 'message lose';
    haptic('lose');
    document.querySelectorAll('.mine-cell').forEach((c, i) => {
      if (minesField[i] === 'mine' && !c.classList.contains('opened')) {
        c.textContent = '💣';
        c.classList.add('opened');
      }
    });
    minesCashBtn.style.display = 'none';
    minesStartBtn.style.display = 'block';
  } else {
    cell.textContent = '💎';
    cell.classList.add('gem');
    minesOpened++;
    const pay = minesPayout();
    minesCashBtn.textContent = `Забрать ${pay}`;
    minesMsg.textContent = `Безопасно! Открыто: ${minesOpened}`;
    minesMsg.className = 'message win';
    haptic('click');
    if (minesOpened === MINES_TOTAL - getMinesCount()) {
      const goldMult = hasUpgrade('mines_gold') ? 1.5 : 1;
      const finalPay = Math.floor(pay * goldMult);
      balance += finalPay;
      updateBalance();
      minesMsg.textContent = `🎉 Все безопасные! +${finalPay}`;
      minesActive = false;
      minesCashBtn.style.display = 'none';
      minesStartBtn.style.display = 'block';
      particles(20);
    }
  }
}

minesCashBtn.onclick = () => {
  if (!minesActive) return;
  const pay = minesPayout();
  const goldMult = hasUpgrade('mines_gold') ? 1.5 : 1;
  const finalPay = Math.floor(pay * goldMult);
  balance += finalPay;
  updateBalance();
  minesMsg.textContent = `💰 Забрано: +${finalPay}`;
  minesMsg.className = 'message win';
  minesActive = false;
  minesCashBtn.style.display = 'none';
  minesStartBtn.style.display = 'block';
  haptic('win');
  particles(15);
};

// === КОСТИ (визуальные точки, а не символы) ===
const DICE_PATTERNS = {
  1: [[1,1]],
  2: [[0,0],[2,2]],
  3: [[0,0],[1,1],[2,2]],
  4: [[0,0],[0,2],[2,0],[2,2]],
  5: [[0,0],[0,2],[1,1],[2,0],[2,2]],
  6: [[0,0],[0,1],[0,2],[2,0],[2,1],[2,2]]
};

function renderDie(dieNum, value) {
  const face = document.getElementById('face' + dieNum);
  face.innerHTML = '';
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      const pip = document.createElement('div');
      pip.className = 'pip';
      const pattern = DICE_PATTERNS[value] || [];
      if (pattern.some(([pr, pc]) => pr === r && pc === c)) pip.classList.add('on');
      face.appendChild(pip);
    }
  }
}
renderDie(1, 1);
renderDie(2, 1);

let diceBet = 10;
const diceBetVal = document.getElementById('diceBetVal');
const diceMsg = document.getElementById('diceMsg');
const diceRollBtn = document.getElementById('diceRollBtn');
let diceRolling = false;

function updateDiceBet() {
  diceBetVal.textContent = diceBet;
  diceRollBtn.textContent = `Бросить (${diceBet})`;
  diceRollBtn.disabled = diceRolling || balance < diceBet;
}
document.getElementById('diceBetMinus').onclick = () => { if (diceBet > 10) { diceBet -= 10; updateDiceBet(); haptic('click'); } };
document.getElementById('diceBetPlus').onclick = () => { if (diceBet + 10 <= balance) { diceBet += 10; updateDiceBet(); haptic('click'); } };

diceRollBtn.onclick = () => {
  if (diceRolling || balance < diceBet) return;
  diceRolling = true;
  balance -= diceBet;
  updateBalance();
  diceMsg.textContent = '';
  diceMsg.className = 'message';
  document.getElementById('die1').classList.add('rolling');
  document.getElementById('die2').classList.add('rolling');
  haptic('click');

  let ticks = 0;
  const rollInterval = setInterval(() => {
    renderDie(1, Math.floor(Math.random()*6)+1);
    renderDie(2, Math.floor(Math.random()*6)+1);
    ticks++;
    if (ticks > 15) {
      clearInterval(rollInterval);
      document.getElementById('die1').classList.remove('rolling');
      document.getElementById('die2').classList.remove('rolling');
      const d1 = Math.floor(Math.random()*6)+1;
      const d2 = Math.floor(Math.random()*6)+1;
      renderDie(1, d1);
      renderDie(2, d2);
      const sum = d1 + d2;
      const luck = hasUpgrade('dice_luck') ? 1.1 : 1;
      const goldMult = hasUpgrade('dice_gold') ? 1.5 : 1;
      let win = 0;
      if (sum === 7 || sum === 11) win = diceBet * 3;
      else if (d1 === d2) win = diceBet * 5;
      else if (sum === 2 || sum === 12) win = diceBet * 10;
      win = Math.floor(win * luck * goldMult);
      if (win > 0) {
        balance += win;
        updateBalance();
        diceMsg.textContent = `🎉 +${win} (сумма ${sum})`;
        diceMsg.className = 'message win';
        haptic('win');
        particles(12);
      } else {
        diceMsg.textContent = `Сумма ${sum}. Не повезло`;
        diceMsg.className = 'message lose';
        haptic('lose');
      }
      diceRolling = false;
      updateDiceBet();
    }
  }, 80);
};

// === РУЛЕТКА ===
const RED_NUMS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const ALL_NUMS = Array.from({length: 37}, (_, i) => i);
function isRed(n) { return RED_NUMS.includes(n); }
function isBlack(n) { return n !== 0 && !isRed(n); }

const rouletteHistory = document.getElementById('rouletteHistory');
const rouletteResult = document.getElementById('rouletteResult');
const rouletteNumbers = document.getElementById('rouletteNumbers');
const rouMsg = document.getElementById('rouMsg');
const rouSpinBtn = document.getElementById('rouSpinBtn');
let rouBet = 10;
const rouBetVal = document.getElementById('rouBetVal');
let rouSelectedBet = null; // 'red', 'black', 'green', or number
let rouSpinning = false;

function buildRouletteNumbers() {
  rouletteNumbers.innerHTML = '';
  // зеро
  const zero = document.createElement('button');
  zero.className = 'rou-num green';
  zero.textContent = '0';
  zero.dataset.num = 0;
  zero.onclick = () => selectRouBet(0, zero);
  rouletteNumbers.appendChild(zero);
  for (let n = 1; n <= 36; n++) {
    const btn = document.createElement('button');
    btn.className = 'rou-num ' + (isRed(n) ? 'red' : 'black');
    btn.textContent = n;
    btn.dataset.num = n;
    btn.onclick = () => selectRouBet(n, btn);
    rouletteNumbers.appendChild(btn);
  }
}
buildRouletteNumbers();

function selectRouBet(bet, el) {
  rouSelectedBet = bet;
  document.querySelectorAll('.rou-num, .roulette-bet-btn').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  haptic('click');
}

document.querySelectorAll('.roulette-bet-btn').forEach(btn => {
  btn.onclick = () => {
    rouSelectedBet = btn.dataset.bet;
    document.querySelectorAll('.rou-num, .roulette-bet-btn').forEach(e => e.classList.remove('selected'));
    btn.classList.add('selected');
    haptic('click');
  };
});

function updateRouBet() {
  rouBetVal.textContent = rouBet;
  rouSpinBtn.textContent = `Крутить (${rouBet})`;
  rouSpinBtn.disabled = rouSpinning || balance < rouBet;
}
document.getElementById('rouBetMinus').onclick = () => { if (rouBet > 10) { rouBet -= 10; updateRouBet(); haptic('click'); } };
document.getElementById('rouBetPlus').onclick = () => { if (rouBet + 10 <= balance) { rouBet += 10; updateRouBet(); haptic('click'); } };

rouSpinBtn.onclick = () => {
  if (rouSpinning || balance < rouBet) return;
  if (rouSelectedBet === null) {
    rouMsg.textContent = 'Сначала выберите ставку!';
    rouMsg.className = 'message lose';
    haptic('lose');
    return;
  }
  rouSpinning = true;
  balance -= rouBet;
  updateBalance();
  rouMsg.textContent = '';
  rouMsg.className = 'message';
  rouletteResult.textContent = '?';
  rouletteResult.className = 'roulette-result spinning-text';
  haptic('click');

  const finalNum = Math.floor(Math.random() * 37);
  let tick = 0;
  const spinInterval = setInterval(() => {
    const n = Math.floor(Math.random() * 37);
    rouletteResult.textContent = n;
    rouletteResult.className = 'roulette-result spinning-text ' + (n === 0 ? 'green' : isRed(n) ? 'red' : 'black');
    tick++;
    if (tick > 25) {
      clearInterval(spinInterval);
      rouletteResult.textContent = finalNum;
      rouletteResult.className = 'roulette-result ' + (finalNum === 0 ? 'green' : isRed(finalNum) ? 'red' : 'black');
      finishRoulette(finalNum);
    }
  }, 60);
};

function finishRoulette(num) {
  // история
  const h = document.createElement('div');
  h.className = 'history-num ' + (num === 0 ? 'green' : isRed(num) ? 'red' : 'black');
  h.textContent = num;
  rouletteHistory.prepend(h);
  while (rouletteHistory.children.length > 10) rouletteHistory.lastChild.remove();

  // расчёт выигрыша
  let mult = 0;
  if (typeof rouSelectedBet === 'number') {
    if (num === rouSelectedBet) mult = 36;
  } else if (rouSelectedBet === 'red') {
    if (isRed(num)) mult = 2;
  } else if (rouSelectedBet === 'black') {
    if (isBlack(num)) mult = 2;
  } else if (rouSelectedBet === 'green') {
    if (num === 0) mult = 14;
  }

  const boost = hasUpgrade('rou_boost') ? 1.05 : 1;
  const goldMult = hasUpgrade('rou_gold') ? 1.5 : 1;

  if (mult > 0) {
    const win = Math.floor(rouBet * mult * boost * goldMult);
    balance += win;
    updateBalance();
    rouMsg.textContent = `🎉 Выпало ${num}! +${win} (×${mult})`;
    rouMsg.className = 'message win';
    haptic('win');
    particles(20);
  } else {
    rouMsg.textContent = `Выпало ${num}. Не повезло`;
    rouMsg.className = 'message lose';
    haptic('lose');
  }
  rouSpinning = false;
  updateRouBet();
}

// === ИНИЦИАЛИЗАЦИЯ ===
updateBet();
updateWheelBet();
updateDiceBet();
updateRouBet();
applyGoldenMode();
updateAllUpgradeButtons();

// пересчёт кнопок улучшений при каждом изменении баланса
setInterval(updateAllUpgradeButtons, 1000);
</script>
